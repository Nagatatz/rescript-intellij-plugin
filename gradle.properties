org.gradle.jvmargs=-XX:MaxHeapSize=512m -Xms512m -Xmx1g

pluginGroup = com.rescript
pluginName = rescript-intellij-plugin
pluginVersion = 0.1.18

# IntelliJ Platform 2026.1.4 (build 261.26222) - the first release whose bundled
# JBR 25 can load the Java 25 bytecode that building against 2026.2 produces.
# Must stay a full build number: "261.4" would also admit 2026.1 .. 2026.1.3.
pluginSinceBuild = 261.26222

# https://www.jetbrains.com/intellij-repository/releases
platformVersion = 2026.2.0.1

# Enable Gradle Configuration Cache
org.gradle.configuration-cache = true
org.gradle.caching = true
org.gradle.parallel = true

kotlin.stdlib.default.dependency=false

# Dokka Gradle plugin V2
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
