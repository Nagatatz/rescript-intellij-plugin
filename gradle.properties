org.gradle.jvmargs=-XX:MaxHeapSize=512m -Xms512m -Xmx1g

pluginGroup = com.rescript
pluginName = rescript-intellij-plugin
pluginVersion = 0.1.15

# IntelliJ Platform 2025.3 - LSP API available to all IDEs
pluginSinceBuild = 253.0

# https://www.jetbrains.com/intellij-repository/releases
platformVersion = 2026.1.2

# Enable Gradle Configuration Cache
org.gradle.configuration-cache = true
org.gradle.caching = true
org.gradle.parallel = true

kotlin.stdlib.default.dependency=false

# Dokka Gradle plugin V2
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
