name: Monthly Plugin Verify

# Runs verifyPlugin against all configured IDE versions on the 1st of
# each month. Since `pluginUntilBuild` is intentionally unset (forward
# compatibility), this catches new IDE majors that introduce
# breakage before users hit them in the wild.
#
# When a failure surfaces here, follow the Verifier blocker triage in
# docs/product-requirements.md (NFR-02).

on:
  workflow_dispatch:
  schedule:
    # 04:00 UTC on the 1st of every month
    - cron: '0 4 1 * *'

concurrency:
  group: monthly-verify-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Force JavaScript actions (incl. transitive actions/cache) onto Node.js 24
# ahead of GitHub's June 2026 default switch.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check ignored-problems expiry
        # Surfaces expired `Expires: YYYY-MM-DD` entries in
        # plugin-verifier-ignored-problems.txt as a CI step summary warning.
        # Does not fail the build — keeps the monthly cadence as a soft
        # reminder so deprecated API suppressions do not rot indefinitely.
        shell: bash
        run: |
          set -euo pipefail
          today="$(date -u +%Y-%m-%d)"
          file="plugin-verifier-ignored-problems.txt"
          if [ ! -f "$file" ]; then
            echo "$file not found, skipping expiry check"
            exit 0
          fi
          expired=()
          while IFS= read -r line; do
            if [[ "$line" =~ Expires:[[:space:]]*([0-9]{4}-[0-9]{2}-[0-9]{2}) ]]; then
              exp="${BASH_REMATCH[1]}"
              if [[ "$exp" < "$today" ]]; then
                expired+=("$exp")
              fi
            fi
          done < "$file"
          if [ "${#expired[@]}" -gt 0 ]; then
            {
              echo "## ⚠️ Expired ignored-problems entries"
              echo ""
              echo "Today (UTC): $today"
              echo ""
              echo "Re-review the following entries in \`plugin-verifier-ignored-problems.txt\`:"
              echo ""
              for e in "${expired[@]}"; do
                echo "- Expires: $e"
              done
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::${#expired[@]} ignored-problems entries are past their Expires date"
          else
            echo "No expired ignored-problems entries"
          fi

      - name: Verify plugin against configured IDE versions
        run: ./gradlew verifyPlugin --info

      - name: Upload verifier report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-verifier-report
          path: build/reports/pluginVerifier/
          retention-days: 30

  template-versions-audit:
    # The npm versions the wizard templates write into user projects live in
    # TemplateVersions.kt, which Dependabot cannot see. Generate a synthetic
    # package.json from those constants and run npm audit against it so new
    # advisories surface on the monthly cadence. Fails on high/critical;
    # moderate findings are visible in the log without failing the run.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Generate manifest from TemplateVersions.kt
        run: node .github/scripts/audit-template-versions.mjs .github/scripts/template-audit

      - name: Resolve lockfile
        working-directory: .github/scripts/template-audit
        # --legacy-peer-deps: the synthetic manifest mixes every template's
        # dependencies, so cross-template peer ranges may conflict; audit
        # only needs a resolved tree, not a valid peer graph.
        run: npm install --package-lock-only --legacy-peer-deps --no-audit --no-fund

      - name: npm audit (fail on high/critical)
        working-directory: .github/scripts/template-audit
        run: npm audit --audit-level=high

      - name: Upload audit manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: template-versions-audit
          path: .github/scripts/template-audit/
          retention-days: 30
