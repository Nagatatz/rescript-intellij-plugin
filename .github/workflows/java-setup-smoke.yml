name: Java Setup Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: java-setup-smoke-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  setup:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Setup JDK
        id: java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Reuse JDK from tool cache
        id: java-reuse
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Check JDK and tool cache reuse
        shell: bash
        env:
          FIRST_JAVA_HOME: ${{ steps.java.outputs.path }}
          REUSED_JAVA_HOME: ${{ steps.java-reuse.outputs.path }}
        run: |
          set -euo pipefail
          test -n "$FIRST_JAVA_HOME"
          test -n "$REUSED_JAVA_HOME"
          test "$FIRST_JAVA_HOME" = "$REUSED_JAVA_HOME"
          test "$JAVA_HOME" = "$REUSED_JAVA_HOME"
          java -version
          version="$(javac -version 2>&1)"
          [[ "$version" == "javac 25" || "$version" == "javac 25."* ]]
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Check Gradle launcher
        shell: bash
        run: ./gradlew --version --no-daemon --no-parallel --max-workers=1
