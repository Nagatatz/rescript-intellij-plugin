name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel queued PR runs when a newer commit lands; keep main runs intact for history.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Force JavaScript actions (incl. transitive actions/cache) onto Node.js 24
# ahead of GitHub's June 2026 default switch.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write  # reviewdog posts PR review comments
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run actionlint
        # Pinned to commit SHA per .claude/rules/github-actions-pinning.md.
        uses: reviewdog/action-actionlint@6fb7acc99f4a1008869fa8a0f09cfca740837d9d  # v1.72.0
        with:
          reporter: github-pr-review
          fail_level: error

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write  # upload SARIF to Code Scanning
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Trivy vulnerability scanner
        # aquasecurity is the upstream Trivy maintainer and a recognised
        # security ecosystem actor (.claude/rules/github-actions-pinning.md
        # exception clause). Semver pin is acceptable; Dependabot tracks bumps.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          # `secret` catches accidentally committed credentials alongside
          # OS/lang CVEs; severity threshold filters HIGH/CRITICAL only.
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy results to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write  # mi-kas/kover-report posts coverage summary on PRs

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # External CLIs that back the cli/ test suite. Each is probed at
      # runtime by ExternalCliAvailability; tests skip when the binary
      # is missing, so this step exists purely to enable those gates
      # in CI without breaking developer machines that lack them.
      - name: Setup Node.js for CLI gates
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Mermaid CLI
        run: npm install -g @mermaid-js/mermaid-cli@11.14.0

      - name: Install graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install ReScript CLI
        run: npm install -g rescript@12.2.0

      - name: Run ktlint
        run: ./gradlew ktlintCheck

      - name: Check KDoc comments
        run: ./gradlew checkKdoc

      - name: Check Extension Point registrations
        run: ./gradlew checkExtensionPointRegistration

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Run tests with coverage
        # mmdc 11.x and pa11y 4.x bundle puppeteer-core, which by design does
        # not auto-download Chrome and instead probes ~/.cache/puppeteer for a
        # version-pinned binary. Point it at the runner's pre-installed Chrome
        # so the cli/ Mermaid gate doesn't fail with "Could not find Chrome".
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: ./gradlew test koverVerify koverXmlReport koverHtmlReport

      - name: Add coverage report to PR
        if: github.event_name == 'pull_request'
        # Pinned to commit SHA per .claude/rules/github-actions-pinning.md.
        uses: mi-kas/kover-report@db9938358b8e1e6175dd4136132bf4eb7aa4ae6d  # v2.4
        with:
          path: ${{ github.workspace }}/build/reports/kover/report.xml
          title: Code Coverage
          update-comment: true
          coverage-counter-type: LINE

      - name: Add coverage to Job Summary
        if: always()
        shell: python
        run: |
          import os
          import pathlib
          import xml.etree.ElementTree as ET

          report = pathlib.Path("build/reports/kover/report.xml")
          if not report.exists():
              raise SystemExit(0)

          root = ET.parse(report).getroot()
          counter = root.find("./counter[@type='LINE']")
          if counter is None:
              raise SystemExit(0)

          covered = int(counter.get("covered", "0"))
          missed = int(counter.get("missed", "0"))
          total = covered + missed
          if total == 0:
              raise SystemExit(0)

          pct = covered * 100 // total
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if not summary_path:
              raise SystemExit(0)

          with open(summary_path, "a", encoding="utf-8") as fh:
              fh.write(
                  "## 📊 Code Coverage\n\n"
                  "| Metric | Value |\n"
                  "|--------|-------|\n"
                  f"| Line Coverage | **{pct}%** |\n"
                  f"| Lines Covered | {covered} / {total} |\n\n"
                  "📄 Full HTML report available in the **coverage-report** artifact.\n"
              )

      - name: Verify plugin structure
        run: ./gradlew verifyPluginStructure

      - name: Verify plugin project configuration
        run: ./gradlew verifyPluginProjectConfiguration

      - name: Verify plugin (binary compatibility)
        run: ./gradlew verifyPlugin

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-zip
          path: build/distributions/*.zip
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: build/reports/tests/
          if-no-files-found: ignore

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: build/reports/kover/html/
          if-no-files-found: ignore

  mutation-test:
    # Pull-request only. Mutation testing is too slow to run on every push
    # to main and provides the most actionable feedback during review.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Run pitest
        run: ./gradlew pitest

      - name: Upload pitest report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pitest-report
          path: build/reports/pitest/
          if-no-files-found: ignore

  template-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # Verifies that every Project Wizard template materializes, installs deps,
    # compiles ReScript, and (where safe) runs vitest end-to-end. Catches bugs
    # that the unit tests can't see — wrong dep versions, ReScript module
    # resolution issues, broken smoke tests — before they reach a user.
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        # Pinned to commit SHA per .claude/rules/github-actions-pinning.md.
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d  # v6.0.5
        with:
          version: 10

      - name: Setup Bun
        # oven-sh is the official Bun maintainer
        # (.claude/rules/github-actions-pinning.md exception clause). Semver
        # pin is acceptable; Dependabot tracks bumps.
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run template integration tests
        run: ./gradlew integrationTest

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: build/reports/tests/integrationTest/
          if-no-files-found: ignore

