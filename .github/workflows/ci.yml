name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          reporter: github-pr-review
          fail_level: error

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Run ktlint
        run: ./gradlew ktlintCheck

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Run tests with coverage
        run: ./gradlew test koverXmlReport koverHtmlReport

      - name: Add coverage report to PR
        if: github.event_name == 'pull_request'
        uses: mi-kas/kover-report@v1
        with:
          path: ${{ github.workspace }}/build/reports/kover/report.xml
          title: Code Coverage
          update-comment: true
          coverage-counter-type: LINE

      - name: Add coverage to Job Summary
        if: always()
        run: |
          if [ -f build/reports/kover/report.xml ]; then
            # Extract coverage from Kover XML report
            LINE_COVERED=$(grep -o 'type="LINE"[^/]*covered="[0-9]*"' build/reports/kover/report.xml | head -1 | grep -o 'covered="[0-9]*"' | grep -o '[0-9]*')
            LINE_MISSED=$(grep -o 'type="LINE"[^/]*missed="[0-9]*"' build/reports/kover/report.xml | head -1 | grep -o 'missed="[0-9]*"' | grep -o '[0-9]*')
            if [ -n "$LINE_COVERED" ] && [ -n "$LINE_MISSED" ]; then
              TOTAL=$((LINE_COVERED + LINE_MISSED))
              if [ "$TOTAL" -gt 0 ]; then
                PERCENTAGE=$((LINE_COVERED * 100 / TOTAL))
                echo "## 📊 Code Coverage" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
                echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
                echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
                echo "| Line Coverage | **${PERCENTAGE}%** |" >> $GITHUB_STEP_SUMMARY
                echo "| Lines Covered | ${LINE_COVERED} / ${TOTAL} |" >> $GITHUB_STEP_SUMMARY
                echo "" >> $GITHUB_STEP_SUMMARY
                echo "📄 Full HTML report available in the **coverage-report** artifact." >> $GITHUB_STEP_SUMMARY
              fi
            fi
          fi

      - name: Verify plugin structure
        run: ./gradlew verifyPluginStructure

      - name: Verify plugin project configuration
        run: ./gradlew verifyPluginProjectConfiguration

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: plugin-zip
          path: build/distributions/*.zip
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: build/reports/tests/
          if-no-files-found: ignore

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: build/reports/kover/html/
          if-no-files-found: ignore

  verify:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Verify plugin (binary compatibility)
        run: ./gradlew verifyPlugin
