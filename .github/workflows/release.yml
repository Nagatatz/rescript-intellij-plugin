name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# Releases must never be cancelled mid-flight; queue serially per tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Force JavaScript actions (incl. transitive actions/cache) onto Node.js 24
# ahead of GitHub's June 2026 default switch.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write  # softprops/action-gh-release creates the GitHub Release

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Validate version consistency
        run: |
          TAG_VERSION="${{ steps.version.outputs.version }}"

          # Check gradle.properties pluginVersion matches tag
          GRADLE_VERSION=$(grep '^pluginVersion' gradle.properties | cut -d= -f2 | tr -d ' ')
          if [ "$TAG_VERSION" != "$GRADLE_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match gradle.properties pluginVersion ($GRADLE_VERSION)"
            exit 1
          fi

          # Check plugin.xml change-notes contains an entry for this version
          if ! grep -q "<h3>${TAG_VERSION}</h3>" src/main/resources/META-INF/plugin.xml; then
            echo "::error::plugin.xml <change-notes> does not contain an entry for version ${TAG_VERSION}"
            exit 1
          fi

          echo "Version consistency check passed: $TAG_VERSION"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        # Pinned to commit SHA per .claude/rules/github-actions-pinning.md.
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v6.0.9
        with:
          version: 10

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run full quality gate
        # ktlint, KDoc, Extension Point checks, unit tests with coverage
        # ratchet, plugin structure, and binary compatibility — all must
        # pass before we tag a Marketplace release.
        run: |
          ./gradlew \
            ktlintCheck \
            checkKdoc \
            checkExtensionPointRegistration \
            test koverVerify koverXmlReport \
            verifyPluginStructure \
            verifyPluginProjectConfiguration \
            verifyPlugin

      - name: Run template integration tests
        # Catches template generation regressions (broken deps, ReScript
        # module resolution issues) before publish.
        run: ./gradlew integrationTest --info

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: plugin-zip
          path: build/distributions/*.zip
          retention-days: 30

      - name: Create GitHub Release
        # Pinned to commit SHA per .claude/rules/github-actions-pinning.md.
        # release job has contents:write, so tag re-pointing is a real risk.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          files: build/distributions/*.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  require-ci-green:
    # Gate the Marketplace publish on the CI workflow being green for the exact
    # commit this tag points at. The tag and its commit are pushed together
    # (see .claude/rules/release.md), so CI runs on `main` in parallel with this
    # Release run; we poll until that CI run completes and require `success`.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read  # gh api reads workflow run conclusions
    steps:
      - name: Wait for CI workflow to succeed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          deadline=$(( SECONDS + 1500 ))  # ~25 min budget; job timeout is the hard cap
          while true; do
            run=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA" \
              --jq '[.workflow_runs[] | select(.event == "push")] | sort_by(.run_started_at) | last')
            status=$(echo "$run" | jq -r '.status // "missing"')
            conclusion=$(echo "$run" | jq -r '.conclusion // ""')
            echo "CI run for $SHA: status=$status conclusion=$conclusion"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "CI is green for $SHA — proceeding to publish."
                exit 0
              fi
              echo "::error::CI for $SHA completed with '$conclusion' (must be 'success'). Refusing to publish."
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Timed out waiting for CI to complete for $SHA. Refusing to publish."
              exit 1
            fi
            sleep 30
          done

  publish:
    runs-on: ubuntu-latest
    needs: [validate-and-build, require-ci-green]
    environment: marketplace
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build plugin
        # publishPlugin re-builds because IntelliJ Platform Gradle Plugin's
        # task graph wires signPlugin/buildPlugin as dependencies. The
        # validate-and-build job ensured the same code passes the full
        # quality gate; here we trust the gate and publish.
        run: ./gradlew buildPlugin

      - name: Publish to JetBrains Marketplace
        # Author-side archive signing is intentionally disabled: a signed
        # upload produced a "plugin archive file cannot be extracted" error on
        # Marketplace (0.1.16). Without these credentials the IntelliJ Platform
        # Gradle Plugin skips signPlugin and uploads the unsigned distribution;
        # Marketplace signs it server-side anyway. Restore the CERTIFICATE_CHAIN
        # / PRIVATE_KEY / PRIVATE_KEY_PASSWORD env vars once the signing
        # certificate is verified/regenerated.
        run: ./gradlew publishPlugin
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
