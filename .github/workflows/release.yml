name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# Releases must never be cancelled mid-flight; queue serially per tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write  # softprops/action-gh-release creates the GitHub Release

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Validate version consistency
        run: |
          TAG_VERSION="${{ steps.version.outputs.version }}"

          # Check gradle.properties pluginVersion matches tag
          GRADLE_VERSION=$(grep '^pluginVersion' gradle.properties | cut -d= -f2 | tr -d ' ')
          if [ "$TAG_VERSION" != "$GRADLE_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match gradle.properties pluginVersion ($GRADLE_VERSION)"
            exit 1
          fi

          # Check plugin.xml change-notes contains an entry for this version
          if ! grep -q "<h3>${TAG_VERSION}</h3>" src/main/resources/META-INF/plugin.xml; then
            echo "::error::plugin.xml <change-notes> does not contain an entry for version ${TAG_VERSION}"
            exit 1
          fi

          echo "Version consistency check passed: $TAG_VERSION"

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run full quality gate
        # ktlint, KDoc, Extension Point checks, unit tests with coverage
        # ratchet, plugin structure, and binary compatibility — all must
        # pass before we tag a Marketplace release.
        run: |
          ./gradlew \
            ktlintCheck \
            checkKdoc \
            checkExtensionPointRegistration \
            test koverVerify koverXmlReport \
            verifyPluginStructure \
            verifyPluginProjectConfiguration \
            verifyPlugin

      - name: Run template integration tests
        # Catches template generation regressions (broken deps, ReScript
        # module resolution issues) before publish.
        run: ./gradlew integrationTest --info

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: plugin-zip
          path: build/distributions/*.zip
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: build/distributions/*.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  publish:
    runs-on: ubuntu-latest
    needs: validate-and-build
    environment: marketplace
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build plugin
        # publishPlugin re-builds because IntelliJ Platform Gradle Plugin's
        # task graph wires signPlugin/buildPlugin as dependencies. The
        # validate-and-build job ensured the same code passes the full
        # quality gate; here we trust the gate and publish.
        run: ./gradlew buildPlugin

      - name: Publish to JetBrains Marketplace
        run: ./gradlew publishPlugin
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
