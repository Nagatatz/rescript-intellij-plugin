name: CodeQL

# CodeQL static analysis for Java/Kotlin sources. Findings are
# uploaded to the Security tab where they show up alongside Trivy
# (filesystem) and Dependabot (deps) alerts.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday 05:00 UTC
    - cron: '0 5 * * 1'

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Force JavaScript actions (incl. transitive actions/cache) onto Node.js 24
# ahead of GitHub's June 2026 default switch.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read

    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Compile Kotlin and Java
        # CodeQL needs to observe the build to extract Kotlin/Java sources.
        # --no-build-cache forces real compilation; otherwise FROM-CACHE hits
        # bypass javac/kotlinc invocations and CodeQL's tracer sees nothing,
        # producing "could not process any of it" at finalize.
        run: ./gradlew compileKotlin compileJava --no-build-cache

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
