name: Integration Tests

# Runs the template generation integration tests (./gradlew integrationTest).
# These are intentionally separate from the main CI workflow because they
# require Node.js + pnpm and take ~2 minutes for the full template catalog.

on:
  workflow_dispatch:
  schedule:
    # Nightly at 03:00 UTC
    - cron: '0 3 * * *'
  pull_request:
    paths:
      - 'src/main/kotlin/com/rescript/plugin/wizard/**'
      - 'src/main/resources/templates/**'
      - 'src/main/resources/META-INF/plugin.xml'
      - 'src/test/kotlin/com/rescript/plugin/wizard/**'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/integration-tests.yml'

concurrency:
  group: integration-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  integration-test:
    name: Template integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store and bun cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ steps.pnpm-store.outputs.path }}
            ~/.bun/install/cache
          key: ${{ runner.os }}-pnpm-bun-${{ hashFiles('src/main/resources/templates/**/package.json', 'src/main/resources/templates/**/bun.lockb') }}
          restore-keys: ${{ runner.os }}-pnpm-bun-

      - name: Run template integration tests
        run: ./gradlew integrationTest --info

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-report
          path: build/reports/tests/integrationTest/
          retention-days: 14
