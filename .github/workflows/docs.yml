name: Docs

on:
  push:
    branches: [main]
    paths: ['sphinx-docs/**', 'src/main/kotlin/**', 'build.gradle.kts', 'docs/dokka-module.md']
  pull_request:
    branches: [main]
    paths: ['sphinx-docs/**', 'src/main/kotlin/**', 'build.gradle.kts', 'docs/dokka-module.md']
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'push' && 'pages' || format('docs-{0}', github.head_ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pages: write
  id-token: write

# Force JavaScript actions (incl. transitive actions/cache) onto Node.js 24
# ahead of GitHub's June 2026 default switch.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sphinx-docs

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy type check
        run: uv run mypy _ext/generate_rescript_lexer.py

      - name: Pytest
        run: uv run pytest

      - name: Translation quality check (pofilter)
        run: make check-po

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sphinx-docs

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Build site
        run: make build-all
        env:
          SPHINX_SITE_PREFIX: /rescript-intellij-plugin

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate Kotlin API reference (Dokka)
        working-directory: ${{ github.workspace }}
        run: ./gradlew dokkaGenerate --no-configuration-cache

      - name: Bundle API reference into site
        run: |
          mkdir -p _build/site/api
          cp -r ../build/dokka/html/* _build/site/api/

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: sphinx-docs/_build/site

      - name: Link check
        run: make linkcheck

      - name: Report link check results
        if: always()
        run: |
          if [ -f _build/linkcheck/output.txt ]; then
            {
              echo "## 🔗 Link Check Results"
              echo '```'
              cat _build/linkcheck/output.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sphinx-docs

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Build site
        run: make build-all

      - name: Start local server
        run: |
          cd _build/site
          python3 -m http.server 8765 &
          sleep 2

      - name: Run pa11y-ci
        # Pinned to a specific version for reproducibility. Bump manually
        # when checking against a newer release; Dependabot does not track
        # ad-hoc npx invocations.
        run: npx --yes pa11y-ci@4.1.0 --config .pa11yci.json

  deploy:
    if: github.event_name == 'push'
    needs: [lint-and-test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
