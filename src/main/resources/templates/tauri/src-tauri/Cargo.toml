[package]
name = "{{projectName}}"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# tauri-plugin-* crates paired with the @rescript-tauri/plugin-*
# bindings registered in `src-tauri/src/lib.rs`. Each plugin also
# needs an entry in `src-tauri/capabilities/default.json` before the
# renderer can call it.
tauri-plugin-os = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-log = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
