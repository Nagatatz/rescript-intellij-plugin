[project]
name = "rescript-intellij-plugin-docs"
version = "0.1.0"
description = "Sphinx documentation for the ReScript IntelliJ Plugin"
requires-python = ">=3.12"
dependencies = [
    "Sphinx>=8.0,<10.0",
    "furo>=2024.8,<2026.0",
    "myst-parser>=4.0,<5.0",
    "sphinx-intl>=2.3,<3.0",
    "sphinx-copybutton>=0.5,<1.0",
    "sphinx-design>=0.6,<1.0",
    "sphinxext-opengraph>=0.9,<1.0",
    "sphinx-sitemap>=2.6,<3.0",
    "sphinx-notfound-page>=1.0,<2.0",
    "sphinx-tippy>=0.4,<1.0",
    "sphinx-last-updated-by-git>=0.3,<1.0",
    "sphinx-llms-txt>=0.1",
    "sphinxcontrib-budoux>=0.1",
    "atsphinx-htmx-boost>=0.2",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "sphinx-autobuild>=2024.0",
]

[tool.hatch.build.targets.wheel]
packages = []

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"conf.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
exclude = ["conf\\.py"]

[[tool.mypy.overrides]]
module = ["sphinx.*", "pygments.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
