####################################################################################################################
# WARNING: Do not store sensitive information in this file, as its contents will be included in the Qodana report. #
####################################################################################################################

version: "1.0"
linter: jetbrains/qodana-jvm:2025.3
profile:
  name: qodana.recommended
include:
  - name: CheckDependencyLicenses
exclude:
  - name: All
    paths:
      # Template files — intentional per-template code that appears similar
      - src/main/kotlin/com/rescript/plugin/wizard/templates
  - name: IncorrectStringCapitalizationInspection
    paths:
      # Fixed proper nouns: "Node.js Executable", "ReScript Standard"
      - src/main/kotlin/com/rescript/plugin/binding
      - src/main/kotlin/com/rescript/plugin/codestyle
  - name: DuplicatedCode
    paths:
      # Intentional per-concern code that should not be overly abstracted
      - src/main/kotlin/com/rescript/plugin/debug/RescriptDebugRunConfiguration.kt
      - src/main/kotlin/com/rescript/plugin/analysis/RescriptReanalyzeAnnotator.kt
      - src/main/kotlin/com/rescript/plugin/editor/RescriptListSplitJoinContext.kt
      - src/main/kotlin/com/rescript/plugin/wizard/templates
      - src/main/kotlin/com/rescript/plugin/intention
      - src/main/kotlin/com/rescript/plugin/generate
      - src/main/kotlin/com/rescript/plugin/quickfix
      - src/main/kotlin/com/rescript/plugin/hierarchy
      - src/main/kotlin/com/rescript/plugin/refactor
      # Standard IntelliJ Configurable pattern: disposeUIResources nulls all fields
      - src/main/kotlin/com/rescript/plugin/settings/RescriptConfigurable.kt
      # Standard IntelliJ notification pattern shared across startup activities
      - src/main/kotlin/com/rescript/plugin/config/RescriptFileTypeRecoveryStartupActivity.kt
      - src/main/kotlin/com/rescript/plugin/run/RescriptBuildWatchStartupActivity.kt
  - name: UnusedSymbol
    paths:
      # Lexer token definitions — public API for all tokens generated by JFlex.
      # Many are not yet referenced but are reserved for future parser/highlighter use.
      - src/main/kotlin/com/rescript/plugin/lang/RescriptTokenTypes.kt
  - name: KotlinUnusedImport
    paths:
      # False positive — TextRange is used in getLanguagePlaceholderText override parameter
      - src/main/kotlin/com/rescript/plugin/folding/RescriptFoldingBuilder.kt
  - name: JavaIoSerializableObjectMustHaveReadResolve
    paths:
      # readResolve() is already implemented; Language base class triggers this warning
      - src/main/kotlin/com/rescript/plugin/RescriptLanguage.kt
  - name: UsePropertyAccessSyntax
    paths:
      # setOneLineMode() is protected as property — cannot use property access syntax
      - src/main/kotlin/com/rescript/plugin/repl/RescriptReplPanel.kt
failThreshold: 0