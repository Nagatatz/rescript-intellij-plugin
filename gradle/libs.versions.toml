[versions]
kotlin = "2.3.21"
intellij-platform = "2.16.0"
grammarkit = "2023.3.0.3"
ktlint-gradle = "14.2.0"
ktlint = "1.8.0"
kover = "0.9.8"
foojay = "1.0.0"
junit-jupiter = "6.0.3"
junit-platform = "6.0.3"
junit4 = "4.13.2"
mockito = "5.23.0"
dokka = "2.2.0"
pitest-gradle = "1.19.0"
pitest = "1.25.4"
pitest-junit5 = "1.2.3"

[libraries]
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
intellij-platform = { id = "org.jetbrains.intellij.platform", version.ref = "intellij-platform" }
grammarkit = { id = "org.jetbrains.grammarkit", version.ref = "grammarkit" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
foojay = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojay" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
pitest = { id = "info.solidsoft.pitest", version.ref = "pitest-gradle" }
